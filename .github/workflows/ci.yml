name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_command: npm run package:win
            artifact_name: pikpak-windows
            artifact_path: release/*.exe
          - os: macos-14
            package_command: npm run package:mac
            artifact_name: pikpak-macos-arm64
            artifact_path: |
              release/*.dmg
              release/*-mac-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build and verify IPC contracts
        run: npm run build
      - name: Package application
        run: ${{ matrix.package_command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
